<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>Zero Wattios · Ficha de visita v2</title>
<style>
:root{
  --bg:#0f1117; --panel:#171a22; --panel2:#1d212b; --line:#2a2f3d;
  --tx:#e9e9ed; --tx2:#9aa0b0; --tx3:#6b7280;
  --ac:#8ee600; --ac2:#a8f229; --acbg:rgba(142,230,0,.12);
  --blue:#2ba6f5; --bluebg:rgba(43,166,245,.12);
  --warn:#f5b942; --warnbg:rgba(245,185,66,.12);
  --bad:#f2545b; --badbg:rgba(242,84,91,.12);
  --r:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:120px}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{position:sticky;top:0;z-index:30;background:rgba(15,17,23,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header .wrap{padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:-.02em;font-size:17px}
.logo span{color:var(--ac)}
.sub{color:var(--tx3);font-size:12px;margin-left:auto}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--tx3);margin:26px 0 10px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--tx2);margin-bottom:6px;font-weight:500}
.nota{font-size:11.5px;color:var(--tx3);margin-top:6px;line-height:1.45}
input[type=text],input[type=tel],input[type=email],input[type=number],textarea,select{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  color:var(--tx);padding:11px 12px;font:inherit;font-size:16px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ac)}
textarea{min-height:88px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-width:74px;background:var(--panel2);border:1px solid var(--line);
  color:var(--tx2);border-radius:9px;padding:10px 8px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--acbg);border-color:var(--ac);color:var(--ac2);font-weight:600}
.num{display:flex;align-items:center;gap:8px}
.num button{width:44px;height:44px;flex:none;background:var(--panel2);border:1px solid var(--line);
  color:var(--tx);border-radius:9px;font-size:20px;cursor:pointer;line-height:1}
.num .val{flex:1;width:100%;min-width:0;text-align:center;background:var(--panel2);
  border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:11px;
  font:inherit;font-variant-numeric:tabular-nums;font-weight:600;-moz-appearance:textfield}
.num .val:focus{outline:none;border-color:var(--ac);background:var(--panel)}
.num .val::-webkit-outer-spin-button,.num .val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num .suf{flex:none;color:var(--tx2);font-size:13px;min-width:34px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:10px}
.foto{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--panel2)}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border:0;border-radius:50%;
  background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:1;cursor:pointer;padding:0}
.foto .n{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);color:#fff;
  font-size:10px;text-align:center;padding:2px 0}
.bfoto{display:block;width:100%;background:var(--acbg);border:1px dashed var(--ac);color:var(--ac2);
  border-radius:9px;padding:14px;font:inherit;font-weight:600;cursor:pointer;text-align:center}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.res{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--ac);border-radius:var(--r);padding:16px;margin-bottom:10px}
.res .kick{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ac);font-weight:700}
.res .big{font-size:22px;font-weight:700;margin:6px 0 2px;letter-spacing:-.02em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{background:var(--acbg);border:1px solid rgba(142,230,0,.3);color:var(--ac2);
  border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:600}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}
.kv .k{color:var(--tx2)}
.kv .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.kv.tot{border-top:2px solid var(--ac);border-bottom:0;margin-top:6px;padding-top:12px;font-size:16px}
.kv.tot .v{color:var(--ac2);font-size:18px}
.msg{border-radius:9px;padding:11px 12px;font-size:13px;margin-bottom:8px;line-height:1.5;border:1px solid}
.msg.i{background:var(--bluebg);border-color:rgba(43,166,245,.35);color:#a5d8fb}
.msg.w{background:var(--warnbg);border-color:rgba(245,185,66,.35);color:#f7d79b}
.msg.e{background:var(--badbg);border-color:rgba(242,84,91,.35);color:#f9a3a7}
.msg.ok{background:var(--acbg);border-color:rgba(142,230,0,.35);color:var(--ac2)}
.msg b{font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(15,17,23,.96);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.bar .in::-webkit-scrollbar{display:none}
.bar button{flex:none;background:var(--panel2);border:1px solid var(--line);color:var(--tx2);
  border-radius:9px;padding:12px 16px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.bar button.p{background:var(--acbg);border-color:var(--ac);color:var(--ac2)}
.bar button:disabled{opacity:.5}
.toast{position:fixed;left:16px;right:16px;bottom:86px;z-index:50;background:var(--panel2);
  border:1px solid var(--ac);color:var(--ac2);border-radius:10px;padding:12px 14px;font-size:13.5px;
  max-width:728px;margin:0 auto;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.hist{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.hist .n{font-weight:600;font-size:14px}
.hist .d{font-size:11.5px;color:var(--tx3)}
.hist button{background:none;border:1px solid var(--line);color:var(--tx2);border-radius:7px;
  padding:6px 10px;font-size:12px;cursor:pointer}
.chk{display:flex;align-items:flex-start;gap:10px;padding:9px 0;font-size:14px;cursor:pointer;border-bottom:1px solid var(--line)}
.chk:last-child{border:0}
.chk input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--ac)}
details summary{cursor:pointer;color:var(--tx2);font-size:13px;padding:6px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";color:var(--ac)}
details[open] summary::before{content:"▾ "}
@media print{
  body{background:#fff;color:#000;padding:0}
  header,.bar,.toast,.seg button:not(.on),.num button,.noprint{display:none!important}
  .card,.res{border-color:#bbb;background:#fff;break-inside:avoid}
  .res .kick,.kv.tot .v,.tag{color:#2a6b00}
}
</style>
</head>
<body>

<header><div class="wrap">
  <div class="logo">ZERO <span>WATTIOS</span></div>
  <div class="sub" id="fecha"></div>
</div></header>

<div class="wrap" id="app"></div>

<div class="bar"><div class="in">
  <button class="p" id="bEnviar">Enviar ficha</button>
  <button id="bGuardar">Guardar</button>
  <button id="bCsv">Exportar CSV</button>
  <button id="bPrint">Imprimir / PDF</button>
  <button id="bNueva">Ficha nueva</button>
</div></div>

<script>
/* ============================================================
   ZERO WATTIOS · FICHA DE VISITA v2
   Toda la lógica de dimensionado de la v1 + gastos, ayudas,
   financiación y envío al motor de automatización.
   ============================================================ */

const ZONAS    = { A:0.80, B:0.88, C:1.00, D:1.12, E:1.25 };
const ZONA_TXT = { A:'Muy cálida', B:'Cálida', C:'Templada', D:'Fría', E:'Muy fría' };
const AISL     = { '<1980':92, '1980-2007':70, '2007-2019':52, '>2019':38 };

/* Factor de sustitución: cuánto cuesta la energía térmica con aerotermia
   respecto a lo que costaba con el generador actual. Editable en la ficha. */
const FACTOR = { gasoil:0.35, glp:0.30, gas:0.55, electrica:0.30, ninguno:1.00 };

/* Bonificación de IBI por municipio (Comunidad de Madrid), a agosto de 2026.
   ok:true  = verificado contra ordenanza o recopilación oficial
   ok:false = existe bonificación pero el % o el plazo NO están confirmados
   REVISAR SIEMPRE la ordenanza fiscal vigente antes de ponerlo en una propuesta. */
const IBI = {
  'Madrid':               {pct:50, anios:5, ok:true,  nota:'7 años si hay baterías. Tope: 50% del coste al año, 95% acumulado.'},
  'Móstoles':             {pct:50, anios:4, ok:true,  nota:''},
  'Pozuelo de Alarcón':   {pct:50, anios:3, ok:true,  nota:''},
  'Coslada':              {pct:50, anios:3, ok:true,  nota:''},
  'Galapagar':            {pct:50, anios:5, ok:true,  nota:'Requiere que la instalación cubra al menos el 40% del suministro total. La bonificación tiene que estar CONCEDIDA antes del 1 de enero del año en que empieza a aplicar: pídela con tiempo.'},
  'Boadilla del Monte':   {pct:45, anios:3, ok:true,  nota:''},
  'Las Rozas':            {pct:40, anios:5, ok:true,  nota:'Entre 40% y 50% según el porcentaje de suministro cubierto. Aquí va el valor prudente.'},
  'Alcobendas':           {pct:40, anios:3, ok:true,  nota:'Entre 40% y 50% según el porcentaje de suministro cubierto. Aquí va el valor prudente.'},
  'Getafe':               {pct:30, anios:4, ok:true,  nota:'Antes eran 10 años; se redujo a 4.'},
  'San Sebastián de los Reyes':{pct:50, anios:8, tope:400, ok:false, nota:'Subió del 25% al 50% en 2025. Tope de 400 € al año: si el 50% de tu IBI pasa de esa cifra, la bonificación se queda en 400 €. Sin confirmar contra la ordenanza: compruébalo.'},
  'Guadalix de la Sierra':{pct:30, anios:5, ok:false, nota:'Sin confirmar contra la ordenanza. Las fuentes que hay dicen que exige cubrir al menos el 70% del suministro total: con una cobertura del 60% NO entraría. Compruébalo en el ayuntamiento antes de ponerlo por escrito.'},
  'Collado Villalba':     {pct:50, anios:5, ok:false, nota:''},
  'Algete':               {pct:50, anios:5, ok:false, nota:''},
  'Majadahonda':          {pct:50, anios:3, ok:false, nota:''},
  'Valdemoro':            {pct:35, anios:10,ok:false, nota:''},
  'Rivas-Vaciamadrid':    {pct:35, anios:5, ok:false, nota:''},
  'Otro / a confirmar':   {pct:0,  anios:0, ok:false, nota:''}
};

/* Deducción de IRPF por obras de mejora energética.
   La base máxima es POR TECNOLOGÍA: 7.500 € de aerotermia + 7.500 € de fotovoltaica.
   Con las dos, la base es 15.000 € y el cliente se deduce el % del tramo sobre esa base. */
const BASE_IRPF = 7500;
const IRPF = {
  '60': {pct:60, txt:'60% · rehabilitación energética del edificio (≥30% de energía primaria no renovable o letra A/B)'},
  '40': {pct:40, txt:'40% · reducción ≥30% de energía primaria o letra A/B en la vivienda'},
  '20': {pct:20, txt:'20% · reducción ≥7% de demanda de calefacción y refrigeración'},
  '0':  {pct:0,  txt:'Sin deducción / a confirmar'}
};

/* Coeficientes de financiación (Finlight).  cuota = importe financiado × coeficiente.
   Si cambian las tarifas, se cambian aquí y en 00_Config del motor. */
const COEF_FIN = {
  72:0.018336, 84:0.01636, 108:0.01376, 120:0.01234902, 132:0.01161679,
  144:0.01101403, 156:0.01050942, 168:0.01008303, 180:0.00971918,
  192:0.0094053, 204:0.00913215, 216:0.0088948, 228:0.00868524, 240:0.00850064
};
const PLAZOS = [72,84,108,120,132,144,156,168,180,192,204,216,228,240];

/* Precios de catálogo. Si cambian, se cambian aquí y en 00_Config del motor. */
const KWH_MODULO_BATERIA = 5.3;     // cada módulo son 5,3 kWh
const PRECIO_MODULO_BATERIA = 2570; // € por módulo, IVA incluido
const PRECIO_CARGADOR = 1870;       // € el cargador de coche, IVA incluido
const coefFin = m => COEF_FIN[Number(m)] || 0;
const plazoTxt = m => m + ' meses · ' + (m/12) + ' años';

/* Nombre real del municipio: si está elegido "Otro", el que se haya escrito a mano.
   Si lo escrito coincide con uno de la tabla, se le aplica su bonificación igual. */
const munNombre = f => {
  const otro = String(f.municipioOtro || '').trim();
  return (f.municipio === 'Otro / a confirmar' && otro) ? otro : f.municipio;
};

const miles = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const eur   = n => miles(n) + ' €';
const eur2  = n => { const v=Math.round(n*100)/100, e=Math.floor(Math.abs(v)),
    d=String(Math.round((Math.abs(v)-e)*100)).padStart(2,'0');
    return (v<0?'-':'') + miles(e) + ',' + d + ' €'; };
const hoy   = () => new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
const hoyISO= () => new Date().toISOString().slice(0,10);

const KEY_F='zw.ficha.actual.v3', KEY_H='zw.fichas.historico.v3', KEY_URL='zw.endpoint', KEY_CLAVE='zw.clave';
const KEY_FOTOS='zw.fotos.v1';
const MAX_FOTOS = 10;
const LADO_FOTO = 1920;    // px del lado mayor
const CALIDAD_FOTO = 0.8;  // JPEG

const VACIA = {
  /* --- comercial y cliente --- */
  tecnico:'', propuesta:'', cliente:'', dni:'', cotitular:'', dniCotitular:'',
  direccion:'', municipio:'Madrid', municipioOtro:'', cp:'', telefono:'', email:'', cups:'',
  aero:'si', pv:'si', bateria:'no', cargador:'no',
  /* --- vivienda --- */
  zona:'D', m2:120, altura:2.6, anyo:'1980-2007', personas:4, banos:2,
  /* --- instalación actual --- */
  emisor:'rad_bt', caldera:'gasoil', calderaKw:24, suministro:'mono',
  potenciaContratada:5.75, ec:'si', refrig:'si',
  /* --- gastos actuales --- */
  gastoLuzMes:110, gastoCombAnio:1800, consumo:6000, ibiAnual:0,
  factorSust:0, coberturaFV:60,
  /* --- ACS, inercia y tramos --- */
  modulo:'trio', acsL:0, inerciaL:0, distDep:1.5, distExt:8,
  /* --- fotovoltaica --- */
  placas:0, tipoPlaca:'', inversor:'', numInversores:1, tejado:'teja',
  bateriaModulos:0, bateriaKwh:0, bateriaModelo:'', precioBateria:0, precioCargador:0,
  /* --- oferta y financiación --- */
  precioAero:0, precioFV:0, cae:0, tramoIrpf:'60',
  reserva:0, mensualidades:120, cuotaAuto:'si',
  cuotaAero:0, cuotaFV:0, cuotaBateria:0, cuotaCargador:0,
  slot:'', garantiaAero:10, garantiaFV:15, campana:'regular',
  /* --- cierre --- */
  estado:'propuesta', fechaDecision:'', observaciones:'', motivoNo:''
};

let F = Object.assign({}, VACIA);
let FOTOS = [];        // {nombre, url (dataURL), kb}
let subiendo = false;
let HIST = [];
let ENDPOINT = '';
let CLAVE = '';
let enviando = false;

/* ---------- persistencia ---------- */
function guardarLocal(){ try{
  localStorage.setItem(KEY_F, JSON.stringify(F));
  localStorage.setItem(KEY_H, JSON.stringify(HIST));
  localStorage.setItem(KEY_URL, ENDPOINT);
  localStorage.setItem(KEY_CLAVE, CLAVE);
}catch(e){}
  /* Las fotos van aparte y en su propio try: pesan mucho y el móvil puede
     quedarse sin sitio. Si no caben, siguen en memoria hasta que se envíen. */
  try{ localStorage.setItem(KEY_FOTOS, JSON.stringify(FOTOS)); }
  catch(e){ try{ localStorage.removeItem(KEY_FOTOS); }catch(e2){} }
}

function cargarLocal(){ try{
  const f = JSON.parse(localStorage.getItem(KEY_F)||'null');
  const h = JSON.parse(localStorage.getItem(KEY_H)||'[]');
  ENDPOINT = localStorage.getItem(KEY_URL)||'';
  CLAVE = localStorage.getItem(KEY_CLAVE)||'';
  if(f) F = Object.assign({}, VACIA, f);
  if(Array.isArray(h)) HIST = h;
}catch(e){}
  try{ const ft = JSON.parse(localStorage.getItem(KEY_FOTOS)||'[]');
       if(Array.isArray(ft)) FOTOS = ft; }catch(e){}
}

/* ---------- fotos ---------- */
/* Se comprimen en el propio móvil antes de nada: lado mayor 1920 px y JPEG.
   Una foto de 4 MB de cámara se queda en unos 300 KB. */
function comprimirFoto(file){
  return new Promise(function(resolve, reject){
    const lector = new FileReader();
    lector.onerror = function(){ reject(new Error('no se pudo leer la foto')); };
    lector.onload = function(){
      const img = new Image();
      img.onerror = function(){ reject(new Error('archivo no válido')); };
      img.onload = function(){
        let w = img.width, h = img.height;
        const may = Math.max(w, h);
        if(may > LADO_FOTO){ const k = LADO_FOTO / may; w = Math.round(w*k); h = Math.round(h*k); }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        const url = c.toDataURL('image/jpeg', CALIDAD_FOTO);
        resolve({nombre: file.name || 'foto', url: url,
                 kb: Math.round(url.length * 0.75 / 1024)});
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(file);
  });
}

function anadirFotos(files){
  const lista = Array.prototype.slice.call(files || []);
  if(!lista.length) return;
  const hueco = MAX_FOTOS - FOTOS.length;
  if(hueco <= 0){ toast('Ya hay '+MAX_FOTOS+' fotos. Borra alguna para añadir otra.'); return; }
  const usar = lista.slice(0, hueco);
  if(lista.length > hueco) toast('Solo caben '+MAX_FOTOS+': se añaden '+hueco+'.');
  toast('Procesando '+usar.length+' foto'+(usar.length>1?'s':'')+'…');
  Promise.all(usar.map(comprimirFoto)).then(function(res){
    FOTOS = FOTOS.concat(res);
    guardarLocal(); render();
    toast(FOTOS.length+' foto'+(FOTOS.length>1?'s':'')+' en la ficha ('+pesoFotos()+').');
  }).catch(function(e){ toast('Alguna foto no se pudo procesar: '+e.message); });
}

function borrarFoto(i){ FOTOS.splice(i,1); guardarLocal(); render(); }
function pesoFotos(){
  const kb = FOTOS.reduce(function(a,x){ return a + (x.kb||0); }, 0);
  return kb > 1024 ? (kb/1024).toFixed(1).replace('.',',')+' MB' : kb+' KB';
}

/* ---------- cálculo ---------- */
function calc(f){
  f = f || F;
  const cascada  = f.m2 > 500;
  const kw       = f.m2 <= 160 ? 12 : f.m2 <= 270 ? 16 : f.m2 <= 350 ? 19 : 22;
  const demanda  = f.m2 * AISL[f.anyo] * ZONAS[f.zona] * (f.altura/2.5) / 1000;
  const acs      = f.acsL || (f.personas <= 6 ? 200 : 300);
  const ht       = f.suministro === 'tri' ? 'HTT' : 'HT';
  const gama     = ht + (f.ec === 'si' ? ' EC' : '') + ' PRO';
  const unidades = cascada ? 2 : 1;
  const modelo   = (cascada ? '2 × ' : '') + 'Dual Clima ' + kw + ' ' + gama;
  const separador= f.emisor !== 'suelo';
  const tanque   = !f.inerciaL ? 'Sin depósito de inercia' : (separador?'BTS ':'BT ') + f.inerciaL;
  const acsCat   = [150,200,300].indexOf(acs) !== -1;
  const acumulador = acsCat
      ? (f.modulo==='trio' ? 'Fusion HT Trio '+acs : 'Sanit '+acs)
      : 'Acumulador ACS '+acs+' L (fuera de catálogo Fusion)';
  const tejadoTxt = {teja:'Cubierta de teja inclinada',pizarra:'Cubierta de pizarra',
    chapa:'Cubierta de chapa',plana:'Cubierta plana con lastre',suelo:'Estructura en suelo'}[f.tejado]||'';
  const conAero = f.aero === 'si', conFV = f.pv === 'si';

  /* ----- economía ----- */
  const factor   = f.factorSust > 0 ? f.factorSust/100 : FACTOR[f.caldera];
  const luzAnio  = f.gastoLuzMes * 12;
  const combAnio = f.gastoCombAnio;
  const actual   = luzAnio + combAnio;

  const termFut  = conAero ? combAnio * factor : combAnio;
  const subtotal = termFut + luzAnio;
  const cobFV    = conFV ? f.coberturaFV/100 : 0;
  const futuro   = subtotal * (1 - cobFV);
  const ahorro   = Math.max(0, actual - futuro);
  const ahorroMes= ahorro / 12;

  /* ----- inversión y ayudas ----- */
  /* Cuatro partidas independientes: aerotermia, fotovoltaica, batería y cargador.
     Cada una con su precio y su cuota. */
  const conBat = conFV && f.bateria === 'si';
  const conCar = f.cargador === 'si';
  const modulosBat  = conBat ? (Number(f.bateriaModulos) || 0) : 0;
  const kwhBat      = Math.round(modulosBat * KWH_MODULO_BATERIA * 10) / 10;
  const precioBatSug = modulosBat * PRECIO_MODULO_BATERIA;
  const precioAero  = conAero ? (Number(f.precioAero) || 0) : 0;
  const precioFV    = conFV   ? (Number(f.precioFV)   || 0) : 0;
  const precioBat   = conBat ? (Number(f.precioBateria) > 0 ? Number(f.precioBateria) : precioBatSug) : 0;
  const precioCar   = conCar ? (Number(f.precioCargador) > 0 ? Number(f.precioCargador) : PRECIO_CARGADOR) : 0;
  const inversion   = precioAero + precioFV + precioBat + precioCar;
  const tramo     = IRPF[f.tramoIrpf] || IRPF['0'];
  /* Base de deducción: 7.500 € por tecnología. Con las dos, 15.000 €. */
  const baseAeroIrpf = conAero ? Math.min(precioAero, BASE_IRPF) : 0;
  /* La batería forma parte de la instalación fotovoltaica, así que suma a su base.
     El cargador de coche NO: tiene su propia deducción, distinta de esta. */
  const baseFVIrpf   = conFV   ? Math.min(precioFV + precioBat, BASE_IRPF) : 0;
  const baseIrpf     = tramo.pct > 0 ? baseAeroIrpf + baseFVIrpf : 0;
  const deduccion    = Math.round(baseIrpf * tramo.pct/100);
  const muniTxt   = munNombre(f);
  const ibiMun    = IBI[muniTxt] || IBI['Otro / a confirmar'];
  /* Algunos ayuntamientos ponen un tope anual en euros (San Sebastián de los Reyes,
     400 €/año). Si no hay tope, no se limita nada. */
  const ibiAnual  = f.ibiAnual * ibiMun.pct/100;
  const ibiTopado = ibiMun.tope ? Math.min(ibiAnual, ibiMun.tope) : ibiAnual;
  const ibiTotal  = Math.round(ibiTopado * ibiMun.anios);
  /* El CAE NO se descuenta de la factura: es dinero que cobra el cliente, como el IRPF
     y el IBI. La factura es la inversión completa; el CAE va del lado de las ayudas. */
  const ayudas    = deduccion + ibiTotal + f.cae;
  const facturado = inversion;
  const costeReal = Math.max(0, facturado - deduccion - ibiTotal - f.cae);
  const retorno   = ahorro > 0 ? costeReal / ahorro : 0;

  /* ----- financiación -----
     El importe financiado de cada tecnología sale del precio, menos el CAE (que se
     descuenta en la factura de la aerotermia) y menos la parte proporcional de la
     reserva. La cuota es ese importe por el coeficiente del plazo. */
  const coef = coefFin(f.mensualidades);
  const repartoRes = p => inversion > 0 ? f.reserva * p / inversion : 0;
  const finAero = Math.max(0, precioAero - repartoRes(precioAero));
  const finFV   = Math.max(0, precioFV   - repartoRes(precioFV));
  const finBat  = Math.max(0, precioBat  - repartoRes(precioBat));
  const finCar  = Math.max(0, precioCar  - repartoRes(precioCar));
  const cuotaAeroAuto = Math.round(finAero * coef * 100) / 100;
  const cuotaFVAuto   = Math.round(finFV   * coef * 100) / 100;
  const cuotaBatAuto  = Math.round(finBat  * coef * 100) / 100;
  const cuotaCarAuto  = Math.round(finCar  * coef * 100) / 100;
  const auto     = f.cuotaAuto !== 'no';
  const cuotaAero = conAero ? (auto ? cuotaAeroAuto : Number(f.cuotaAero) || 0) : 0;
  const cuotaFV   = conFV   ? (auto ? cuotaFVAuto   : Number(f.cuotaFV)   || 0) : 0;
  const cuotaBat  = conBat  ? (auto ? cuotaBatAuto  : Number(f.cuotaBateria)  || 0) : 0;
  const cuotaCar  = conCar  ? (auto ? cuotaCarAuto  : Number(f.cuotaCargador) || 0) : 0;
  const cuota     = cuotaAero + cuotaFV + cuotaBat + cuotaCar;
  const esfuerzo  = cuota - ahorroMes;
  const coste0    = cuota > 0 && esfuerzo <= 0;
  const aplazado  = Math.max(0, facturado - f.reserva);
  const cuotaTeorica = f.mensualidades > 0 ? aplazado / f.mensualidades : 0;
  const plazoCoste0  = ahorroMes > 0 ? Math.ceil(aplazado / ahorroMes) : 0;
  const totalPagado  = cuota * f.mensualidades + f.reserva;
  const intereses    = Math.max(0, totalPagado - facturado);

  return {kw,cascada,unidades,demanda,acs,acsCat,acumulador,modelo,gama,tanque,separador,
    tejadoTxt,conAero,conFV,factor,luzAnio,combAnio,actual,futuro,ahorro,ahorroMes,
    inversion,tramo,baseIrpf,baseAeroIrpf,baseFVIrpf,deduccion,muniTxt,ibiMun,ibiTotal,ayudas,
    facturado,costeReal,retorno,
    conBat,conCar,modulosBat,kwhBat,precioAero,precioFV,precioBat,precioCar,precioBatSug,
    coef,auto,finAero,finFV,finBat,finCar,
    cuotaAero,cuotaFV,cuotaBat,cuotaCar,
    cuotaAeroAuto,cuotaFVAuto,cuotaBatAuto,cuotaCarAuto,
    cuota,esfuerzo,coste0,aplazado,cuotaTeorica,plazoCoste0,totalPagado,intereses};
}

/* ---------- avisos ---------- */
function avisos(){
  const f=F, r=calc(), a=[];
  const W=t=>({t:'w',x:t}), I=t=>({t:'i',x:t}), E=t=>({t:'e',x:t}), OK=t=>({t:'ok',x:t});

  if(!r.conAero && !r.conFV) a.push(E('La ficha no tiene marcada ni aerotermia ni fotovoltaica: activa al menos una.'));
  if(!f.cliente) a.push(E('Falta el nombre del cliente.'));
  if(!f.email) a.push(E('Falta el email: sin él el motor no puede enviar la propuesta.'));
  if(!f.gastoCombAnio && !f.gastoLuzMes) a.push(E('Sin gastos actuales no se puede calcular el ahorro. Pide la factura antes de salir de la casa.'));
  const mun = r.ibiMun;
  if(!f.ibiAnual && mun.pct) a.push(W('Falta el IBI anual: sin él no se puede cuantificar la bonificación de '+mun.pct+'% durante '+mun.anios+' años.'));
  if(f.municipio==='Otro / a confirmar' && !String(f.municipioOtro||'').trim()) a.push(E('Has marcado «Otro»: escribe el nombre del municipio en el campo de debajo.'));
  else if(!mun.pct) a.push(W(r.muniTxt+': no hay bonificación de IBI cargada. Consulta la ordenanza fiscal del ayuntamiento antes de prometer nada.'));
  else if(!mun.ok) a.push(W('La bonificación de IBI de '+r.muniTxt+' NO está verificada contra la ordenanza vigente. Compruébala en la web del ayuntamiento antes de ponerla por escrito en la propuesta.'));
  else if(mun.nota) a.push(I(r.muniTxt+': '+mun.nota));
  if(!f.cups) a.push(W('Falta el CUPS. Está en la factura de la luz y hace falta para la legalización.'));

  if(r.conAero && r.cascada) a.push(W('Superficie por encima de 500 m²: cascada de dos unidades de igual potencia. La combinación final la decide el técnico.'));
  if(r.conAero && r.kw>=22 && f.suministro==='mono') a.push(W('22 kW en monofásico: comprobar potencia contratada y arranque. Recomendable trifásica 400 V.'));
  if(r.conAero && f.refrig==='si' && (f.emisor==='rad_at'||f.emisor==='rad_bt')) a.push(W('Los radiadores no dan frío: prever fancoils o suelo refrescante en las estancias a refrigerar.'));
  if(r.conAero && f.emisor==='rad_at') a.push(I('Radiador tradicional a 60–75 °C: la Dual Clima HT/HTT (R290) llega a 75 °C de impulsión, no hace falta apoyo de caldera.'));
  if(r.conAero && Math.abs(r.demanda-r.kw)/r.kw > 0.3) a.push(W('La estimación por zona y aislamiento da '+r.demanda.toFixed(1).replace('.',',')+' kW frente a los '+r.kw+' kW de tarifa. Revisar si procede subir o bajar un escalón.'));
  if(r.conAero && f.distDep>2) a.push(W('Son '+String(f.distDep).replace('.',',')+' m de la máquina a los depósitos (más de 2 m): contar tubería, aislamiento reforzado y pérdidas de carga en el presupuesto.'));
  if(r.conAero && f.distExt>10) a.push(W('Son '+f.distExt+' m de los depósitos a la unidad exterior (más de 10 m): revisar sección de tubería, caudal mínimo, aislamiento a la intemperie y volumen de glicol.'));
  if(r.conAero && !r.acsCat) a.push(W(r.acs+' L no es una capacidad de catálogo (150, 200 o 300 L): ajustar o confirmar disponibilidad antes de pedir material.'));
  if(r.conFV && r.conAero) a.push(f.ec==='si'
    ? I('Dual Clima '+(f.suministro==='tri'?'HTT':'HT')+' EC PRO con Easy Connect: gestión de excedente fotovoltaico integrada hacia ACS e inercia.')
    : W('Sin módulo Easy Connect la máquina va como '+(f.suministro==='tri'?'HTT':'HT')+' PRO: no hay conectividad wifi ni gestión automática del excedente fotovoltaico.'));
  if(f.bateria==='si' && !r.conFV) a.push(W('Hay batería marcada pero no fotovoltaica: la batería va con la instalación solar. Revísalo.'));
  if(r.conBat && !r.modulosBat) a.push(W('Batería marcada como sí pero sin módulos: pon cuántos lleva y completa el modelo antes de cerrar la ficha.'));

  if(r.conAero && f.caldera==='gas') a.push(W('Cliente de gas natural: el ahorro es más moderado y el coste 0 puede no salir. Argumenta confort, refrigeración y letra energética, y NO prometas coste 0 sin comprobar el número.'));
  if(f.caldera==='gasoil'||f.caldera==='glp') a.push(OK('Cliente de '+(f.caldera==='gasoil'?'gasóleo':'propano')+': es el mejor caso de amortización. Retorno típico de 4 a 6 años.'));
  if(r.cuota>0 && r.coste0) a.push(OK('COSTE 0: la cuota de '+eur2(r.cuota)+'/mes cabe dentro del ahorro de '+eur2(r.ahorroMes)+'/mes. Se puede plantear así.'));
  if(!r.auto) a.push(W('Las cuotas están puestas <b>a mano</b>, no salen de la tabla de financiación. Comprueba que son las que da la financiera antes de firmar.'));
  if(r.coef===0) a.push(E('El plazo de '+f.mensualidades+' meses no está en la tabla de coeficientes: la cuota no se puede calcular. Elige uno de los plazos de la lista.'));
  if(r.auto && r.intereses>0) a.push(I('Con '+f.mensualidades+' meses el cliente paga '+eur(r.totalPagado)+' en total por '+eur(r.facturado)+' de instalación: '+eur(r.intereses)+' de coste de financiación. Dilo si te lo preguntan.'));
  if(r.tramo.pct===60) a.push(W('Tramo del 60%: la ficha calcula '+eur(r.deduccion)+' con base de '+eur(BASE_IRPF)+' por tecnología. La normativa fija además un <b>límite anual</b> de base de deducción, así que puede que el cliente no se lo deduzca todo en un solo ejercicio. Di "hasta '+eur(r.deduccion)+'" y que lo confirme con su asesor: no prometas que se lo devuelven de golpe el año que viene.'));
  if(r.tramo.pct===60 && !(r.conAero&&r.conFV)) a.push(I('Con una sola tecnología la base es '+eur(r.baseIrpf)+', no '+eur(2*BASE_IRPF)+'.'));
  if(r.tramo.pct>0 && r.baseIrpf < (r.conAero?BASE_IRPF:0)+(r.conFV?BASE_IRPF:0)) a.push(I('La base de deducción ('+eur(r.baseIrpf)+') es menor que el máximo porque algún precio está por debajo de '+eur(BASE_IRPF)+'.'));
  if(r.cuota>0 && !r.coste0) a.push(W('NO es coste 0: la cuota de '+eur2(r.cuota)+'/mes supera el ahorro de '+eur2(r.ahorroMes)+'/mes en '+eur2(r.esfuerzo)+'. Para que salga a coste 0 harían falta unas '+r.plazoCoste0+' mensualidades. Dilo tal cual: no lo prometas.'));
  if(!f.fechaDecision && f.estado==='propuesta') a.push(E('Sin fecha de decisión. No salgas de la visita sin ella.'));
  return a;
}

function descargarCsv(fichas, nombre){
  const esc = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
  const cab = filas().map(c=>c[0]);
  const cuerpo = fichas.map(fi => filas(fi).map(c=>esc(c[1])).join(';'));
  const csv = '﻿' + cab.map(esc).join(';') + '\n' + cuerpo.join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download = nombre; a.click();
  return cab.length;
}

/* ---------- envío al motor ---------- */
function nuevoId(){
  const a='abcdefghijkmnpqrstuvwxyz23456789'; let t='';
  for(let i=0;i<16;i++) t += a.charAt(Math.floor(Math.random()*a.length));
  return t;
}

function enviar(){
  if(!F.cliente){ toast('Pon al menos el nombre del cliente.'); return; }
  if(!F.email){ toast('Falta el email del cliente: el motor no puede enviar la propuesta.'); return; }
  if(!ENDPOINT){ toast('Falta la URL del motor. Ábrela en «Conexión con el motor» y pégala.'); return; }
  if(!CLAVE){ toast('Falta la clave del motor. Pégala en «Conexión con el motor».'); return; }
  const r = calc();
  const idFicha = nuevoId();
  const cuerpo = {
    clave:    CLAVE,
    cabecera: filas().map(c=>c[0]),
    fila:     filas().map(c=>c[1]==null?'':c[1]),
    datos:    Object.assign({}, F, {municipio: r.muniTxt, _idFicha: idFicha,
                                    _fecha:hoy(), _fechaISO:hoyISO()}),
    calculo:  r,
    cliente:  F.cliente,
    email:    F.email,
    fecha:    hoy()
  };
  const dir = F.direccion;
  enviando = true; render();
  fetch(ENDPOINT,{method:'POST',mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(cuerpo)})
    .then(()=>{
      enviando=false; guardarFicha(true);
      toast('Ficha de '+F.cliente+' enviada. La propuesta le llega a '+F.email+' en menos de 30 minutos.');
      render();
      if(FOTOS.length) subirFotos(idFicha, cuerpo.cliente, dir);
    })
    .catch(()=>{ enviando=false;
      toast('No se pudo conectar. Revisa la URL del motor o la cobertura. La ficha se ha guardado en el móvil.');
      guardarFicha(true); render(); });
}

/* Las fotos van después de la ficha y de una en una: si falla una, no se
   pierde la ficha ni las demás. */
function subirFotos(idFicha, cliente, direccion){
  const cola = FOTOS.slice();
  const total = cola.length;
  subiendo = true; render();
  let i = 0, fallos = 0;
  const siguiente = function(){
    if(i >= total){
      subiendo = false;
      FOTOS = []; guardarLocal(); render();
      toast(fallos
        ? (total-fallos)+' de '+total+' fotos subidas. '+fallos+' fallaron: repite la visita en el histórico si hacen falta.'
        : total+' foto'+(total>1?'s':'')+' subidas a la carpeta del cliente.');
      return;
    }
    const f = cola[i];
    const coma = f.url.indexOf(',');
    fetch(ENDPOINT,{method:'POST',mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({
        clave: CLAVE, accion:'foto', idFicha: idFicha,
        cliente: cliente, direccion: direccion,
        indice: i+1, total: total, nombre: f.nombre,
        datos: f.url.slice(coma+1)
      })})
      .then(function(){ i++; toast('Subiendo fotos… '+i+' de '+total); siguiente(); })
      .catch(function(){ fallos++; i++; siguiente(); });
  };
  siguiente();
}

function guardarFicha(silencio){
  if(!F.cliente){ toast('Pon al menos el nombre del cliente antes de guardar.'); return; }
  HIST = HIST.concat([Object.assign({}, F, {_fecha:hoy(), _fechaISO:hoyISO(), _id:Date.now()})]);
  guardarLocal();
  if(!silencio) toast('Ficha de '+F.cliente+' guardada. Ya son '+HIST.length+' en el móvil.');
  render();
}

function nueva(){
  const tec = F.tecnico;
  F = Object.assign({}, VACIA, {tecnico:tec});
  FOTOS = [];
  guardarLocal(); toast('Ficha nueva en blanco.'); render();
  window.scrollTo({top:0,behavior:'smooth'});
}

let _t;
function toast(txt){
  let el = document.getElementById('toast');
  if(!el){ el = document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
  el.textContent = txt; el.style.display='block';
  clearTimeout(_t); _t = setTimeout(()=>{ el.style.display='none'; }, 4200);
}

/* ---------- helpers de UI ---------- */
function set(k,v){
  if(k==='mensualidades') v = Number(v) || 120;
  F[k]=v;
  if(k==='bateria' && v==='no'){ F.bateriaModulos=0; F.bateriaKwh=0; F.bateriaModelo=''; F.precioBateria=0; F.cuotaBateria=0; }
  if(k==='cargador' && v==='no'){ F.precioCargador=0; F.cuotaCargador=0; }
  guardarLocal(); render();
}
function bump(k,d,min,max){
  F[k] = Math.min(max, Math.max(min, Math.round((Number(F[k])+d)*100)/100));
  guardarLocal(); render();
}
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

function txt(k,label,ph,nota,tipo){
  return '<div class="card"><label>'+label+'</label>'+
    '<input type="'+(tipo||'text')+'" data-k="'+k+'" value="'+esc(F[k])+'" placeholder="'+esc(ph||'')+'">'+
    (nota?'<div class="nota">'+nota+'</div>':'')+'</div>';
}
function area(k,label,ph,nota){
  return '<div class="card"><label>'+label+'</label>'+
    '<textarea data-k="'+k+'" placeholder="'+esc(ph||'')+'">'+esc(F[k])+'</textarea>'+
    (nota?'<div class="nota">'+nota+'</div>':'')+'</div>';
}
function seg(k,label,opts,nota){
  const b = opts.map(o=>'<button data-seg="'+k+'" data-v="'+esc(o[0])+'" class="'+(F[k]==o[0]?'on':'')+'">'+o[1]+'</button>').join('');
  return '<div class="card"><label>'+label+'</label><div class="seg">'+b+'</div>'+
    (nota?'<div class="nota">'+nota+'</div>':'')+'</div>';
}
/* Campo numérico: se puede teclear directamente o usar los botones + y −.
   Acepta coma o punto decimal y puntos de millar ("12.990" y "12990" valen igual). */
function num(k,label,step,min,max,suf,nota){
  const v = Number(F[k]) || 0;
  const disp = String(v).replace('.',',');
  return '<div class="card"><label>'+label+'</label><div class="num">'+
    '<button data-b="'+k+'" data-d="'+(-step)+'" data-min="'+min+'" data-max="'+max+'">−</button>'+
    '<input class="val" type="text" inputmode="decimal" autocomplete="off" '+
      'data-n="'+k+'" data-min="'+min+'" data-max="'+max+'" value="'+esc(disp)+'">'+
    (suf?'<span class="suf">'+suf+'</span>':'')+
    '<button data-b="'+k+'" data-d="'+step+'" data-min="'+min+'" data-max="'+max+'">+</button>'+
    '</div>'+(nota?'<div class="nota">'+nota+'</div>':'')+'</div>';
}

/* "12.990,50" · "12990,5" · "12990.5" → 12990.5 */
function aNumero(txt){
  let t = String(txt).trim().replace(/\s|€|%/g,'');
  if(t==='') return 0;
  if(t.indexOf(',') !== -1) t = t.replace(/\./g,'').replace(',','.');
  else if((t.match(/\./g)||[]).length > 1) t = t.replace(/\./g,'');
  else { const p = t.split('.'); if(p.length===2 && p[1].length===3) t = p.join(''); }
  const n = parseFloat(t);
  return isNaN(n) ? 0 : n;
}
function sel(k,label,opts,nota){
  const o = opts.map(x=>'<option value="'+esc(x)+'"'+(F[k]==x?' selected':'')+'>'+x+'</option>').join('');
  return '<div class="card"><label>'+label+'</label><select data-k="'+k+'">'+o+'</select>'+
    (nota?'<div class="nota">'+nota+'</div>':'')+'</div>';
}
function kv(k,v,cls){ return '<div class="kv '+(cls||'')+'"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'; }

    '<div class="nota">'+(CLAVE
      ? 'Clave puesta. El motor rechaza cualquier ficha que no la traiga.'
      : '<b style="color:var(--warn)">Sin clave el motor rechaza el envío.</b> Es la misma que hay en CLAVE_FICHA del motor.')+'</div></div>';

  /* HISTÓRICO */
  h += '<h2>Fichas guardadas en este móvil</h2><div class="card noprint">';
  if(!HIST.length) h += '<div class="nota">Aún no hay fichas guardadas.</div>';
  else h += HIST.slice().reverse().map(x =>
    '<div class="hist"><div><div class="n">'+esc(x.cliente||'Sin nombre')+'</div>'+
    '<div class="d">'+esc(x._fecha||'')+' · '+esc(munNombre(x)||'')+' · '+esc(x.estado||'')+'</div></div>'+
    '<div style="display:flex;gap:6px"><button data-abrir="'+x._id+'">Abrir</button>'+
    '<button data-borrar="'+x._id+'">Borrar</button></div></div>').join('');
  h += '</div>';

  document.getElementById('app').innerHTML = h;
  document.getElementById('bEnviar').textContent =
    enviando ? 'Enviando…' : (subiendo ? 'Subiendo fotos…' : 'Enviar ficha');
  document.getElementById('bEnviar').disabled = enviando || subiendo;
}

/* ---------- eventos ---------- */
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.id === 'endp'){ ENDPOINT = t.value.trim(); guardarLocal(); return; }
  if(t.id === 'clave'){ CLAVE = t.value.trim(); guardarLocal(); return; }
  const nk = t.getAttribute('data-n');
  if(nk){
    const max = Number(t.getAttribute('data-max'));
    let val = aNumero(t.value);
    if(val > max) val = max;
    F[nk] = val;
    if(nk === 'cuotaAero' || nk === 'cuotaFV') F.cuotaAuto = 'no';
    guardarLocal();   // sin render: si repintáramos aquí, se perdería el cursor
    return;
  }
  const k = t.getAttribute('data-k');
  if(k){ F[k] = t.value; guardarLocal(); }
});
/* Al salir del campo se normaliza (mínimo, formato) y se repinta la ficha entera. */
document.addEventListener('blur', e=>{
  const t = e.target, nk = t && t.getAttribute && t.getAttribute('data-n');
  if(!nk) return;
  const min = Number(t.getAttribute('data-min')), max = Number(t.getAttribute('data-max'));
  let val = aNumero(t.value);
  if(val < min) val = min;
  if(val > max) val = max;
  F[nk] = Math.round(val*100)/100;
  guardarLocal(); render();
}, true);
document.addEventListener('change', e=>{
  const k = e.target.getAttribute('data-k');
  if(k && e.target.tagName === 'SELECT'){ set(k, e.target.value); }
});
document.addEventListener('change', e=>{
  if(e.target.id === 'fotoIn'){ anadirFotos(e.target.files); e.target.value=''; }
});
document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.id === 'bFoto'){ const i = document.getElementById('fotoIn'); if(i) i.click(); return; }
  if(b.dataset.foto !== undefined){ borrarFoto(Number(b.dataset.foto)); return; }
  if(b.dataset.seg){ set(b.dataset.seg, b.dataset.v); return; }
  if(b.dataset.b){ bump(b.dataset.b, Number(b.dataset.d), Number(b.dataset.min), Number(b.dataset.max)); return; }
  if(b.dataset.abrir){
    const x = HIST.find(z => String(z._id) === b.dataset.abrir);
    if(x){ F = Object.assign({}, VACIA, x); guardarLocal(); toast('Ficha de '+(x.cliente||'sin nombre')+' cargada.'); render(); window.scrollTo({top:0,behavior:'smooth'}); }
    return;
  }
  if(b.dataset.borrar){
    HIST = HIST.filter(z => String(z._id) !== b.dataset.borrar);
    guardarLocal(); toast('Ficha borrada.'); render(); return;
  }
});
document.getElementById('bEnviar').onclick  = enviar;
document.getElementById('bGuardar').onclick = ()=>guardarFicha(false);
document.getElementById('bPrint').onclick   = ()=>window.print();
document.getElementById('bNueva').onclick   = ()=>{ if(confirm('¿Empezar una ficha nueva en blanco?')) nueva(); };
document.getElementById('bCsv').onclick     = ()=>{
  const todas = HIST.concat([F]);
  const n = descargarCsv(todas, 'zero-wattios-clientes-'+hoyISO()+'.csv');
  toast('Exportado: '+todas.length+' fichas × '+n+' campos.');
};

cargarLocal();
render();
</script>
</body>
</html>
